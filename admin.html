<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOLSOE TV Theme Control V173.4</title>
  <script src="theme-admin.js" defer></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:34px;
      font-family:Arial,Helvetica,sans-serif;color:#fff;
      background:radial-gradient(circle at top,#22113a 0,#080812 42%,#030307 100%);
    }
    .wrap{max-width:1300px;margin:0 auto}
    h1{margin:0 0 8px;font-size:44px;letter-spacing:1px;text-transform:uppercase}
    .sub{opacity:.76;margin-bottom:22px;font-size:18px}
    #status{margin:18px 0 28px;padding:16px 20px;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(255,255,255,.08);font-size:20px;font-weight:800;color:#00ffcc}
    .theme-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:18px}
    button{
      min-height:120px;padding:18px;border-radius:24px;border:2px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);color:white;font-size:22px;font-weight:900;cursor:pointer;
      box-shadow:0 0 28px rgba(0,0,0,.35);transition:transform .15s ease,background .15s ease,border-color .15s ease;
      text-transform:uppercase;letter-spacing:1px
    }
    button:hover{transform:scale(1.03);background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}
    button.active{border-color:#00ffcc;box-shadow:0 0 30px rgba(0,255,204,.45)}
    @media(max-width:900px){body{padding:18px}.theme-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FOLSOE TV Theme Control</h1>
    <div class="sub">V173.4 Live Theme Sync — styrer StreamElements via Cloudflare API.</div>
    <div id="status">Klar</div>

    <div class="theme-grid">
      <button data-theme="fredagsbar" onclick="setTheme('fredagsbar')">Fredagsbar</button>
      <button data-theme="popup" onclick="setTheme('popup')">Popup</button>
      <button data-theme="trance" onclick="setTheme('trance')">Trance</button>
      <button data-theme="retro" onclick="setTheme('retro')">Retro</button>
      <button data-theme="eurodance" onclick="setTheme('eurodance')">Eurodance</button>
      <button data-theme="morning" onclick="setTheme('morning')">Morning</button>
      <button data-theme="summer" onclick="setTheme('summer')">Summer</button>
      <button data-theme="weekend" onclick="setTheme('weekend')">Weekend</button>
      <button data-theme="chart" onclick="setTheme('chart')">Chart</button>
      <button data-theme="disco" onclick="setTheme('disco')">Disco</button>
    </div>
  </div>
</body>
</html>
