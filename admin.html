<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ FOLSOE Admin V815</title><link rel="stylesheet" href="assets/css/admin.css"></head>
<body>
<header><h1>V815 Broadcast Cloud Admin</h1><input id="token" placeholder="ADMIN_TOKEN"><button onclick="saveToken()">Gem token</button></header>
<main>
<section><h2>Theme Engine</h2><div id="themeButtons" class="buttons"></div><p id="themeStatus">Loading...</p></section>
<section><h2>Sprog / Language / Sprache</h2><div class="buttons"><button onclick="setLanguage('da')">Dansk</button><button onclick="setLanguage('en')">English</button><button onclick="setLanguage('de')">Deutsch</button></div></section>
<section><h2>Top ticker maskine · theme only</h2><button onclick="addTicker('top')">Tilføj top</button><button onclick="saveTicker('top')">Gem top</button><div id="topEditor"></div></section>
<section><h2>Bottom ticker maskine</h2><button onclick="addTicker('bottom')">Tilføj bund</button><button onclick="saveTicker('bottom')">Gem bund</button><div id="bottomEditor"></div></section>
<section><h2>Test</h2><button onclick="window.open(API_BASE+'/api/overlay/v170-state','_blank')">Overlay API</button><button onclick="window.open(API_BASE+'/api/theme','_blank')">Theme API</button></section>
</main><script src="assets/js/admin.js"></script></body></html>
