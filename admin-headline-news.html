<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ FOLSOE · Headline News CMS</title>
<style>
:root{--bg:#070914;--panel:#11162a;--panel2:#171d34;--line:#2d3657;--text:#f7f8ff;--muted:#9da8c7;--red:#eb2148;--pink:#ff3e9d;--purple:#7857ff;--cyan:#37d9ff;--green:#2ce3a0;--orange:#ff9f43}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,rgba(120,87,255,.22),transparent 28%),radial-gradient(circle at 90% 0,rgba(255,62,157,.17),transparent 25%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}
.shell{max-width:1560px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,var(--orange),var(--pink),var(--purple));font-size:24px;font-weight:950}.brand h1{margin:0;font-size:28px}.brand p{margin:5px 0 0;color:var(--muted)}
.pill{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#101529;font-weight:900}.pill.ok{color:var(--green);border-color:rgba(44,227,160,.45)}.toolbar,.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:linear-gradient(180deg,rgba(20,25,47,.98),rgba(10,13,27,.98));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 46px rgba(0,0,0,.25);margin-bottom:16px}
button{border:0;border-radius:11px;padding:12px 15px;color:#fff;background:#28304d;font-weight:900;cursor:pointer}.primary{background:linear-gradient(100deg,var(--purple),var(--pink))}.good{background:linear-gradient(100deg,#0f9368,var(--green));color:#06130d}.danger{background:#542034}.ghost{background:#171c33;border:1px solid var(--line)}button:hover{filter:brightness(1.1)}
input,select{width:100%;padding:11px;border:1px solid #303959;border-radius:10px;background:#090d1b;color:#fff;outline:none}input:focus,select:focus{border-color:var(--purple)}label{display:block;margin-bottom:6px;color:#bac3dd;font-size:11px;font-weight:850;letter-spacing:.06em}
.connection{display:grid;grid-template-columns:1.3fr .9fr auto;gap:12px;align-items:end}.grid{display:grid;gap:12px}.headline{position:relative;display:grid;grid-template-columns:44px minmax(280px,2.2fr) 130px 120px 110px 170px 90px;gap:10px;align-items:end;padding:14px;border:1px solid #28314f;border-radius:15px;background:#0c1020}.headline.dragging{opacity:.45}.handle{align-self:center;text-align:center;color:#6f7b9f;font-size:22px;cursor:grab}.rowNumber{position:absolute;right:12px;top:9px;color:#56617e;font-size:10px;font-weight:900}.checks{display:flex;gap:10px;align-items:center;padding-bottom:10px}.checks label{margin:0;display:flex;gap:6px;align-items:center}.checks input{width:auto}.preview{min-height:150px;display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center;border-left:6px solid var(--red);background:linear-gradient(110deg,#0a0d16,#1a1e2c);border-radius:16px;padding:18px}.previewBadge{width:95px;height:95px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ef3157,#8f1232);font-size:13px;font-weight:950;letter-spacing:.12em}.previewKicker{font-size:12px;color:#ff718d;font-weight:950;letter-spacing:.14em}.previewTitle{font-size:27px;font-weight:950;line-height:1.08;margin-top:10px;max-width:1000px}.previewSource{color:#aeb8d2;margin-top:10px;font-weight:800}.status{margin-top:10px;color:var(--muted)}.status.error{color:#ff7189}.status.success{color:#64efb9}
@media(max-width:1200px){.headline{grid-template-columns:36px 1fr 120px 110px}.headline>*:nth-child(n+6){grid-column:span 2}.connection{grid-template-columns:1fr}}
@media(max-width:700px){.headline{grid-template-columns:1fr}.handle{display:none}.headline>*{grid-column:auto!important}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<div class="top">
 <div class="brand"><div class="logo">DJ</div><div><h1>Headline News CMS</h1><p>DJ FOLSOE NETWORK · Editorial control for overlay and website</p></div></div>
 <div id="apiPill" class="pill">NOT CONNECTED</div>
</div>

<section class="card">
 <div class="connection">
  <div><label>Broadcast Core API</label><input id="apiBase" value="https://djfolsoe-tv-api.sunefolsoe.workers.dev"></div>
  <div><label>ADMIN_TOKEN</label><input id="token" type="password" placeholder="Stored only in this browser"></div>
  <button id="connect" class="primary">LOAD CMS</button>
 </div>
 <div id="status" class="status">Enter your ADMIN_TOKEN and load the current Broadcast Core.</div>
</section>

<section class="card">
 <div class="toolbar">
  <button id="publish" class="good">PUBLISH HEADLINES</button>
  <button id="previewNext" class="primary">PREVIEW NEXT</button>
  <button id="clearExpired" class="ghost">REMOVE EXPIRED</button>
  <button id="reset" class="danger">RESET TEN ROWS</button>
 </div>
</section>

<section class="card">
 <div class="settings">
  <div><label>Headline hold</label><select id="holdSeconds"><option>6</option><option selected>9</option><option>12</option><option>15</option></select></div>
  <div><label>Now Playing hold</label><select id="musicSeconds"><option>15</option><option selected>21</option><option>30</option><option>45</option></select></div>
  <div><label>Footer text</label><input id="footerText" value="MORE STORIES THROUGHOUT THE SHOW"></div>
  <div class="checks"><label><input id="enabled" type="checkbox" checked> CMS enabled</label></div>
 </div>
</section>

<section class="card">
 <div id="rows" class="grid"></div>
</section>

<section class="card">
 <div class="preview">
  <div class="previewBadge">NEWS</div>
  <div><div id="previewKicker" class="previewKicker">HEADLINE NEWS · WORLD</div><div id="previewTitle" class="previewTitle">Select Preview Next to see a headline.</div><div id="previewSource" class="previewSource">DJ FOLSOE HEADLINE NEWS</div></div>
 </div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const API_KEY="djf_headline_news_api";
const TOKEN_KEY="djf_admin_token";
const categories=["MUSIC","STREAMING","TECH","DENMARK","EUROPE","WORLD","SPORT"];
const priorities=["top","normal","low"];
let currentCore={};
let previewIndex=0;

function id(){return "headline-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function clean(v,max=180){return String(v??"").replace(/\s+/g," ").trim().slice(0,max)}
function isoLocalValue(value){if(!value)return"";const d=new Date(value);if(Number.isNaN(d.getTime()))return"";const pad=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toIso(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toISOString()}
function defaultItem(order){return{id:id(),order,active:order<=3,breaking:false,title:"",category:categories[(order-1)%categories.length],source:"DJ FOLSOE",priority:order===1?"top":"normal",startAt:"",expiresAt:"",link:""}}
function getApi(){return $("apiBase").value.trim().replace(/\/$/,"")}
function getToken(){return $("token").value.trim()}
function setStatus(msg,type=""){$("status").textContent=msg;$("status").className="status "+type}
async function request(path,options={}){
 const headers={"Content-Type":"application/json","Accept":"application/json",...(options.headers||{})};
 const token=getToken();if(token){headers["x-admin-token"]=token;headers["X-Admin-Token"]=token;headers["Authorization"]="Bearer "+token}
 const response=await fetch(getApi()+path,{cache:"no-store",...options,headers});
 const text=await response.text();let data={};try{data=JSON.parse(text)}catch{data={raw:text}}
 if(!response.ok)throw new Error(data.error||data.message||`HTTP ${response.status}`);
 return data;
}
function unwrap(raw){return raw?.core||raw?.data||raw?.broadcast||raw||{}}
function rowTemplate(item,index){
 return `<div class="headline" draggable="true" data-index="${index}">
  <div class="handle">⋮⋮</div>
  <div><label>Headline ${index+1}</label><input data-field="title" value="${escapeHtml(item.title||"")}" maxlength="180" placeholder="Write a concise headline"></div>
  <div><label>Category</label><select data-field="category">${categories.map(x=>`<option ${x===item.category?"selected":""}>${x}</option>`).join("")}</select></div>
  <div><label>Priority</label><select data-field="priority">${priorities.map(x=>`<option ${x===item.priority?"selected":""}>${x.toUpperCase()}</option>`).join("")}</select></div>
  <div><label>Source</label><input data-field="source" value="${escapeHtml(item.source||"DJ FOLSOE")}" maxlength="40"></div>
  <div><label>Expires</label><input data-field="expiresAt" type="datetime-local" value="${isoLocalValue(item.expiresAt)}"></div>
  <div class="checks"><label><input data-field="active" type="checkbox" ${item.active!==false?"checked":""}> LIVE</label><label><input data-field="breaking" type="checkbox" ${item.breaking?"checked":""}> BREAKING</label></div>
  <span class="rowNumber">#${index+1}</span>
 </div>`;
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function renderRows(items){
 const list=[...items];while(list.length<10)list.push(defaultItem(list.length+1));
 $("rows").innerHTML=list.slice(0,10).map(rowTemplate).join("");
 bindDrag();
}
function collectRows(){
 return [...document.querySelectorAll(".headline")].map((row,index)=>({
  id:row.dataset.id||id(),order:index+1,
  title:clean(row.querySelector('[data-field="title"]').value),
  category:row.querySelector('[data-field="category"]').value,
  priority:row.querySelector('[data-field="priority"]').value,
  source:clean(row.querySelector('[data-field="source"]').value,40)||"DJ FOLSOE",
  expiresAt:toIso(row.querySelector('[data-field="expiresAt"]').value),
  startAt:"",
  active:row.querySelector('[data-field="active"]').checked,
  breaking:row.querySelector('[data-field="breaking"]').checked,
  link:""
 })).filter(item=>item.title||item.active);
}
function activeItems(){
 const now=Date.now();
 const rank={top:3,normal:2,low:1};
 return collectRows().filter(x=>x.active&&x.title&&(!x.expiresAt||Date.parse(x.expiresAt)>now))
  .sort((a,b)=>(rank[b.priority]-rank[a.priority])||(a.order-b.order));
}
async function load(){
 localStorage.setItem(API_KEY,getApi());if(getToken())localStorage.setItem(TOKEN_KEY,getToken());
 setStatus("Loading Broadcast Core…");
 const raw=await request("/api/broadcast");
 currentCore=unwrap(raw);
 const cms=currentCore.headlineNews||{};
 $("enabled").checked=cms.enabled!==false;
 $("holdSeconds").value=String(cms.holdSeconds||9);
 $("musicSeconds").value=String(cms.musicSeconds||21);
 $("footerText").value=cms.footerText||"MORE STORIES THROUGHOUT THE SHOW";
 renderRows(Array.isArray(cms.items)?cms.items:[]);
 $("apiPill").textContent="CMS CONNECTED";$("apiPill").className="pill ok";
 setStatus(`Loaded ${Array.isArray(cms.items)?cms.items.length:0} saved headlines.`,"success");
}
async function publish(){
 const items=collectRows();
 const headlineNews={
  version:"V18410",enabled:$("enabled").checked,
  holdSeconds:Number($("holdSeconds").value)||9,
  musicSeconds:Number($("musicSeconds").value)||21,
  footerText:clean($("footerText").value,80),
  updatedAt:new Date().toISOString(),
  items
 };
 const next={...currentCore,headlineNews,headlines:items};
 setStatus("Publishing Headline News…");
 const payload={core:next};
 await request("/api/publish",{method:"POST",body:JSON.stringify(payload)});
 currentCore=next;
 setStatus(`Published ${items.filter(x=>x.active&&x.title).length} active headlines.`,"success");
}
function preview(){
 const items=activeItems();
 if(!items.length){$("previewTitle").textContent="NO ACTIVE HEADLINES";return}
 const item=items[previewIndex++%items.length];
 $("previewKicker").textContent=(item.breaking?"BREAKING":"HEADLINE NEWS")+" · "+item.category;
 $("previewTitle").textContent=item.title;
 $("previewSource").textContent=item.source+" · "+item.priority.toUpperCase();
}
function removeExpired(){
 const now=Date.now();
 document.querySelectorAll(".headline").forEach(row=>{
  const input=row.querySelector('[data-field="expiresAt"]');
  if(input.value&&new Date(input.value).getTime()<=now){
   row.querySelector('[data-field="title"]').value="";
   row.querySelector('[data-field="active"]').checked=false;
   input.value="";
  }
 });
 setStatus("Expired stories removed locally. Click Publish Headlines.","success");
}
function bindDrag(){
 let dragged=null;
 document.querySelectorAll(".headline").forEach(row=>{
  row.addEventListener("dragstart",()=>{dragged=row;row.classList.add("dragging")});
  row.addEventListener("dragend",()=>{row.classList.remove("dragging");dragged=null;renumber()});
  row.addEventListener("dragover",e=>{e.preventDefault();if(!dragged||dragged===row)return;const rect=row.getBoundingClientRect();row.parentNode.insertBefore(dragged,e.clientY<rect.top+rect.height/2?row:row.nextSibling)});
 });
}
function renumber(){document.querySelectorAll(".headline").forEach((row,i)=>{row.dataset.index=i;row.querySelector(".rowNumber").textContent="#"+(i+1);row.querySelector("label").textContent="Headline "+(i+1)})}
$("connect").onclick=()=>load().catch(e=>setStatus(e.message,"error"));
$("publish").onclick=()=>publish().catch(e=>setStatus(e.message,"error"));
$("previewNext").onclick=preview;
$("clearExpired").onclick=removeExpired;
$("reset").onclick=()=>{if(confirm("Reset all ten rows?"))renderRows([])};
$("apiBase").value=localStorage.getItem(API_KEY)||$("apiBase").value;
$("token").value=localStorage.getItem(TOKEN_KEY)||"";
renderRows([]);
</script>
</body>
</html>
