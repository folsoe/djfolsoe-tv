<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJ FOLSOE · Broadcast Cloud</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="siteTop">
    <div class="logo">DJ FOLSOE <span>LIVE</span></div>
    <nav><button data-lang="da">DA</button><button data-lang="en">EN</button><button data-lang="de">DE</button></nav>
  </header>
  <main>
    <section class="hero">
      <div class="kicker" data-i18n="brand.kicker">Broadcast Cloud · DJ FOLSOE på Twitch</div>
      <h1 data-i18n="hero.title">DJ FOLSOE</h1>
      <h2 data-i18n="hero.subtitle">Music TV fra Danmark</h2>
      <p data-i18n="hero.body">DJ FOLSOE er en dansk musikstreamer på Twitch...</p>
      <div class="themePill"><span data-i18n="theme.active">Aktivt tema</span>: <b id="activeTheme">loading</b></div>
    </section>
    <section class="tickerSection"><h2>Top ticker</h2><div id="topTickerList" class="cards"></div></section>
    <section class="tickerSection"><h2>Bottom ticker</h2><div id="bottomTickerList" class="cards"></div></section>
    <section><h2 data-i18n="about.title">Hvem er DJ FOLSOE?</h2><p id="aboutText" data-i18n="about.body"></p></section>
    <section><h2 data-i18n="mods.title">Mod-teamet</h2><p data-i18n="mods.body"></p><div id="modsGrid" class="cards"></div></section>
    <section><h2 data-i18n="shows.title">Shows</h2><div id="showsGrid" class="cards"></div></section>
    <section><h2 data-i18n="top20.title">FOLSOE Top 20</h2><div id="chartGrid" class="cards"></div></section>
  </main>
  <script src="assets/js/site.js"></script>
</body>
</html>
