<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOLSOE Overlay</title><link rel="stylesheet" href="assets/style.css"><style>html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}.page{width:1920px;height:1080px;margin:0}.overlay{position:relative;width:1920px;height:1080px;background:var(--theme-bg) center/cover no-repeat}.bug{position:absolute;left:36px;top:30px;border-radius:22px;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.18);padding:16px 22px;font-weight:950;font-size:28px}.theme-title{position:absolute;left:50%;top:32px;transform:translateX(-50%);font-size:32px;font-weight:950;text-shadow:0 4px 18px #000}.boxes{position:absolute;left:34px;right:34px;bottom:34px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.box{height:118px;border-radius:22px;background:rgba(5,8,20,.68);border:1px solid rgba(255,255,255,.18);padding:18px 20px;font-size:24px;overflow:hidden}.box b{display:block;color:#ffdb6d;font-size:18px;letter-spacing:.16em;margin-bottom:8px}.chatline{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;background:#333;object-fit:cover;flex:0 0 auto}</style></head><body><div class="overlay"><div class="bug">DJ FOLSOE LIVE</div><div class="theme-title" data-theme-name></div><div class="boxes"><div class="box"><b>STATUS</b><span data-active-theme></span></div><div class="box"><b>NOW</b>Broadcast Music TV</div><div class="box"><b>COMMUNITY</b>Follower/Sub journey</div><div class="box"><b>CHAT</b><span class="chatline"><img class="avatar" id="chatAvatar"><span id="chatText">Ready for Twitch chat</span></span></div></div></div><script src="assets/app.js"></script><script>async function demoAvatar(login='djfolsoe'){try{const r=await fetch('/api/twitch/user?login='+encodeURIComponent(login));const j=await r.json();if(j.profile_image_url) chatAvatar.src=j.profile_image_url;}catch(e){}}</script></body></html>
